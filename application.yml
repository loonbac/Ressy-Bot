server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:changeme}
    # docker-entrypoint.sh exports RESSY_LAVALINK_PASSWORD from LAVALINK_PASSWORD; the host derives the bot user ID from DISCORD_BOT_TOKEN via GET /users/@me.
    sources:
      youtube: false
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
